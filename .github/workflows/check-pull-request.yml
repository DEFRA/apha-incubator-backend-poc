name: Check Pull Request

on:
  pull_request:
    branches:
      - main
      - minimal
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

  workflow_dispatch:

jobs:
  pr-validator:
    name: Run Pull Request Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Full history required for SonarCloud to detect changes

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Security audit
        run: npm run security-audit

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Build Docker Image
        run: |
          set +e
          docker build --no-cache --tag apha-incubator-backend-poc .
          exit $?

      - name: Run Tests
        run: |
          mkdir -p coverage
          chmod -R a+rw ./coverage
          docker compose -f compose.yml -f compose.test.yml run --build --rm apha-incubator-backend-poc

      - name: Verify Coverage Generation
        run: |
          if [ ! -f "./coverage/lcov.info" ]; then
            echo "WARNING: Coverage file not found at ./coverage/lcov.info"
            ls -la ./coverage/ || echo "Coverage directory does not exist"
          else
            echo "Coverage file found: $(wc -l < ./coverage/lcov.info) lines"
          fi

